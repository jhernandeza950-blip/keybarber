# ==========================================
# KEY BARBER - Configuración Spring Boot
# ==========================================
spring.application.name=keybarber-app
spring.profiles.default=local
spring.main.allow-circular-references=true
server.port=${PORT:8080}

# MongoDB - Conexión Atlas o local
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/keybarber}
spring.data.mongodb.auto-index-creation=true

# Credenciales del Administrador Inicial
keybarber.admin.initial-username=${ADMIN_INITIAL_USERNAME:admin@keybarber.com}
keybarber.admin.initial-password=${ADMIN_INITIAL_PASSWORD:Admin123456!}

# Configuración de Seguridad - JWT
keybarber.security.jwt-secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
keybarber.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cloudinary (opcional para subir fotos de cortes/barberos)
keybarber.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
keybarber.cloudinary.api-key=${CLOUDINARY_API_KEY:}
keybarber.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Configuración de Carga de Archivos
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Compresión GZIP para respuestas HTTP más rápidas
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

